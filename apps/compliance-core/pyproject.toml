[project]
name = "wcp-compliance-core"
version = "5.0.0"
description = "Deterministic payroll compliance validation for Davis-Bacon Act — WCP V5 Compliance Core Service"
authors = [{name = "WCP Team"}]
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "wcp_compliance", from = "src"}]

[tool.poetry.dependencies]
fastapi = ">=0.165.0"
uvicorn = {version = ">=0.32.0", extras = ["standard"]}
pydantic = ">=2.14.4"
pdfplumber = ">=0.11.11"
python-multipart = ">=0.0.34"
pydantic-settings = ">=2.16.3"
opentelemetry-api = ">=1.29.0"
opentelemetry-sdk = ">=1.29.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=1.5.0"
ruff = ">=0.8.0"
mypy = ">=1.13.0"
httpx = "^0.28.1"
httpx2 = ">=2.16.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "eval: golden-set evaluation tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
