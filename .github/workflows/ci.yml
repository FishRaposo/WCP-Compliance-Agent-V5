name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  typescript:
    name: TypeScript Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  compliance-core:
    name: Compliance Core (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/compliance-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run mypy src/
      - run: poetry run pytest tests/unit -v -m "not integration"

  data-platform:
    name: Data Platform (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-platform
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wcp
          POSTGRES_PASSWORD: wcp_test
          POSTGRES_DB: wcp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wcp:wcp_test@localhost:5433/wcp_test
      REDIS_URL: redis://localhost:6380
      SKIP_DB_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run mypy src/
      - run: poetry run pytest tests/unit -v -m "not integration"
      - run: poetry run pytest tests/integration -v -m integration
