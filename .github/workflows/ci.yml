name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/tooling/portfolio-gates.test.mjs
      - name: Reject sibling and Git-installed dependencies
        shell: bash
        run: |
          if git grep -nE '(git\+https://|operator-shared-core|\.\./shared-core|from shared_core|import shared_core)' -- \
            package.json pnpm-lock.yaml pnpm-workspace.yaml apps packages infra README.md docs; then
            echo "::error::Forbidden external or sibling dependency reference found."
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typescript:
    name: TypeScript pipeline and evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - name: Install Compliance Core venv for the TypeScript bridge tests
        working-directory: apps/compliance-core
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm evidence
      - uses: actions/upload-artifact@v4
        with:
          name: wcp-portfolio-evidence
          path: artifacts/portfolio/wcp-compliance-agent-v5-evidence
          if-no-files-found: error

  browser-smoke:
    name: Chromium portfolio smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  compliance-core:
    name: Compliance Core (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/compliance-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - run: poetry check --lock
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run mypy src/
      - run: poetry run pytest tests/unit tests/eval -q

  data-platform:
    name: Data Platform (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-platform
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wcp
          POSTGRES_PASSWORD: wcp_test
          POSTGRES_DB: wcp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wcp:wcp_test@localhost:5433/wcp_test
      REDIS_URL: redis://localhost:6380
      SKIP_DB_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - run: poetry check --lock
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run mypy src/
      - run: poetry run pytest tests/unit -q -m "not integration"
      - run: poetry run pytest tests/integration -q -m integration

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.prod.yml config
      - run: docker compose -f infra/docker-compose.prod.yml build
