name: Golden-Set Evaluation

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM
  workflow_dispatch:

jobs:
  eval:
    name: Golden-Set Evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/compliance-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - run: poetry install --no-interaction
      - run: poetry run pytest tests/eval/ -v --tb=long
      - name: Check for regressions
        if: failure()
        run: |
          echo "::error::Golden-set regression detected. Check the evaluation logs above."
          exit 1
