# Dependency policy (portfolio X7): minor and patch updates arrive as one grouped PR
# per ecosystem; major versions of the framework-level packages below are ignored and
# migrated by hand. pnpm and Poetry lockfiles are updated by Dependabot and CI installs
# from them only (`pnpm install --frozen-lockfile`, `poetry check --lock` + `poetry install`).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/*"
        update-types: [version-update:semver-major]
      - dependency-name: typescript-eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@typescript-eslint/*"
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: zod
        update-types: [version-update:semver-major]
      - dependency-name: express
        update-types: [version-update:semver-major]
      - dependency-name: ioredis
        update-types: [version-update:semver-major]
      # AI SDK v6 pins @ai-sdk/openai ^3; v4 is out of range.
      - dependency-name: "@ai-sdk/openai"
      # Same pin: AI SDK v6 keeps @ai-sdk/anthropic at ^3 (see AGENTS.md ecosystem table).
      - dependency-name: "@ai-sdk/anthropic"
        update-types: [version-update:semver-major]
      - dependency-name: pino
        update-types: [version-update:semver-major]
      - dependency-name: tailwind-merge
        update-types: [version-update:semver-major]
      - dependency-name: "@hono/node-server"
        update-types: [version-update:semver-major]
      # Mastra ecosystem is pinned at the 1.45-generation API surface (see AGENTS.md);
      # coordinated upgrades are deliberate migrations, not patch streams.
      - dependency-name: "@mastra/*"
      - dependency-name: mastra
      - dependency-name: ai
        update-types: [version-update:semver-major]
      - dependency-name: ollama-ai-provider-v2
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directories:
      - "/apps/compliance-core"
      - "/apps/data-platform"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: pydantic
        update-types: [version-update:semver-major]
      - dependency-name: pydantic-settings
        update-types: [version-update:semver-major]
      - dependency-name: fastapi
        update-types: [version-update:semver-major]
      - dependency-name: sqlalchemy
        update-types: [version-update:semver-major]
      - dependency-name: mypy
        update-types: [version-update:semver-major]
      - dependency-name: pytest-asyncio
        update-types: [version-update:semver-major]
      - dependency-name: pyarrow
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      - dependency-name: ruff

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
