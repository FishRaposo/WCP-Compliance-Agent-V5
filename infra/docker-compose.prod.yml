version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wcp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wcp_prod}
      POSTGRES_DB: wcp_compliance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcp"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  compliance-core:
    build: ../apps/compliance-core
    environment:
      DATA_PLATFORM_URL: http://data-platform:8001
      SKIP_DB_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  data-platform:
    build: ../apps/data-platform
    environment:
      DATABASE_URL: postgresql+asyncpg://wcp:${DB_PASSWORD:-wcp_prod}@postgres:5432/wcp_compliance
      REDIS_URL: redis://redis:6379
      SAM_GOV_API_KEY: ${SAM_GOV_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build: ../apps/gateway
    environment:
      AGENT_URL: http://agent:3001
      COMPLIANCE_CORE_URL: http://compliance-core:8000
      DATA_PLATFORM_URL: http://data-platform:8001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - agent
      - compliance-core
      - data-platform

  agent:
    build: ../apps/agent
    environment:
      COMPLIANCE_CORE_URL: http://compliance-core:8000
      DATA_PLATFORM_URL: http://data-platform:8001
      LLM_MODE: ${LLM_MODE:-real}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      - compliance-core
      - data-platform

  web:
    build: ../apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  redisdata:
